# Client URL: http://<host>:48080/anylist
location = /anylist {
    auth_basic           "anylist mcp";
    auth_basic_user_file /etc/nginx/auth/anylist.htpasswd;

    set $upstream "anylist-mcp:8000";
    proxy_pass http://$upstream/mcp;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Don't pass the gateway credential on to the wrapped server
    proxy_set_header Authorization "";

    # MCP streams responses (SSE), so no buffering or caching
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
