# Client URL: http://<host>:48080/anylist
# Auth: "X-MCP-PROXY-PASS: <token>" (tokens in auth/anylist.tokens, minted by add-auth.sh)
location = /anylist {
    if ($anylist_token_ok = 0) {
        return 401;
    }

    set $upstream "anylist-mcp:8000";
    proxy_pass http://$upstream/mcp;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Don't pass the gateway credential on to the wrapped server
    proxy_set_header Authorization "";
    proxy_set_header X-MCP-PROXY-PASS "";

    # MCP streams responses (SSE), so no buffering or caching
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
