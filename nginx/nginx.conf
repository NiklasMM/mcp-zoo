worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    server_tokens off;

    # Docker's embedded DNS. Upstream names are resolved per request (see the
    # location files), so nginx still starts if a wrapped server is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Token auth: clients send the per-server token in the X-MCP-PROXY-PASS
    # header (the deployment environment strips Authorization, so Basic auth
    # cannot be used). Each location checks its map below and returns 401 on a
    # miss. Token files hold one "<token> 1;" line per valid token and are read
    # once at config load by the master process (root), so they can be chmod 600.
    # Mint/rotate tokens with add-auth.sh, then reload nginx.
    map $http_x_mcp_proxy_pass $mealie_token_ok {
        default 0;
        include /etc/nginx/auth/mealie.tokens;
    }
    map $http_x_mcp_proxy_pass $anylist_token_ok {
        default 0;
        include /etc/nginx/auth/anylist.tokens;
    }

    server {
        listen 48080;
        server_name _;

        # One file per wrapped server: nginx/locations/<name>.conf
        include /etc/nginx/locations/*.conf;

        location / {
            return 404;
        }
    }
}
