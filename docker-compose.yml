name: mcp-gateway

services:
  # One supergateway per wrapped stdio server. They all reuse the same image
  # (built once from ./supergateway); add more services like this one.
  mealie-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mealie

    image: mcp-supergateway:local
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --stdio
      - "uvx ${MEALIE_MCP_SOURCE:-git+https://github.com/rldiao/mealie-mcp-server}"
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --streamableHttpPath
      - /mcp
      - --stateful
      - --sessionTimeout
      - "600000"
    environment:
      MEALIE_BASE_URL: ${MEALIE_BASE_URL:?set MEALIE_BASE_URL in .env}
      MEALIE_API_KEY: ${MEALIE_API_KEY:?set MEALIE_API_KEY in .env}
    volumes:
      - uv-cache:/cache
    # No ports published: only nginx can reach this container.
    # If Mealie runs on the Docker host (Linux), uncomment:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  anylist-mcp:
    build:
      context: .
      dockerfile: Dockerfile.anylist
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      ANYLIST_USERNAME: ${ANYLIST_USERNAME:?set ANYLIST_USERNAME in .env}
      ANYLIST_PASSWORD: ${ANYLIST_PASSWORD:?set ANYLIST_PASSWORD in .env}
      ANYLIST_LIST_NAME: ${ANYLIST_LIST_NAME:?set ANYLIST_LIST_NAME in .env}
    command:
      - supergateway
      - --stdio
      - "node src/server.js"
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --streamableHttpPath
      - /mcp
      - --stateful
      - --sessionTimeout
      - "600000"

  gitea-mcp:
    build:
      context: .
      dockerfile: Dockerfile.gitea
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # Any Gitea instance works: https://gitea.com, a self-hosted instance, etc.
      GITEA_HOST: ${GITEA_HOST:?set GITEA_HOST in .env}
      GITEA_ACCESS_TOKEN: ${GITEA_ACCESS_TOKEN:?set GITEA_ACCESS_TOKEN in .env}
      # Optional: hide write tools (create/update/delete) from the agent
      GITEA_READONLY: ${GITEA_READONLY:-}
      # Optional: comma-separated tool scopes (e.g. "issue,pull_request,repository")
      GITEA_SCOPES: ${GITEA_SCOPES:-}
      # Optional: comma-separated individual tool names to expose
      GITEA_TOOLS: ${GITEA_TOOLS:-}
    command:
      - --stdio
      - "gitea-mcp -t stdio"
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --streamableHttpPath
      - /mcp
      - --stateful
      - --sessionTimeout
      - "600000"
    # No ports published: only nginx can reach this container.
    # If Gitea runs on the Docker host (Linux), uncomment:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  actual-mcp:
    build:
      context: .
      dockerfile: Dockerfile.actual
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # URL of the Actual Budget server as seen from inside the Docker network
      # (LAN IP, container name on a shared network, or host.docker.internal
      # with extra_hosts below). Include the scheme, e.g. http://actual.lan:5006
      ACTUAL_SERVER_URL: ${ACTUAL_SERVER_URL:?set ACTUAL_SERVER_URL in .env}
      ACTUAL_PASSWORD: ${ACTUAL_PASSWORD:?set ACTUAL_PASSWORD in .env}
      # Optional: Settings -> Show advanced settings -> Sync ID in Actual.
      # When unset the server falls back to the first budget on the server.
      ACTUAL_BUDGET_SYNC_ID: ${ACTUAL_BUDGET_SYNC_ID:-}
      # Optional: only needed for end-to-end encrypted budget files
      # ACTUAL_BUDGET_ENCRYPTION_PASSWORD: ${ACTUAL_BUDGET_ENCRYPTION_PASSWORD:-}
    command:
      - --stdio
      # No --enable-write: the wrapped server stays read-only
      - "actual-mcp"
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --streamableHttpPath
      - /mcp
      - --stateful
      - --sessionTimeout
      - "600000"
    volumes:
      # Local copy of the budget downloaded by @actual-app/api (ACTUAL_DATA_DIR)
      - actual-data:/data
    # No ports published: only nginx can reach this container.
    # If Actual runs on the Docker host (Linux), uncomment:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - mealie-mcp
    ports:
      # Use "127.0.0.1:48080:48080" to restrict access to this machine.
      - "48080:48080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/locations:/etc/nginx/locations:ro
      - ./auth:/etc/nginx/auth:ro

volumes:
  uv-cache:
  actual-data:
